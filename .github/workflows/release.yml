name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка версии и тега
        shell: pwsh
        run: |
          $v = (Select-String -Path nova.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSION=$v не совпадает с тегом ${{ github.ref_name }}" }

      - name: Установка зависимостей
        shell: pwsh
        run: pip install -r requirements.txt pyinstaller

      - name: Сборка exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Nova --icon icon.png --add-data "icon.png;." --collect-all speech_recognition --collect-all edge_tts --collect-all sounddevice --hidden-import pypdf --hidden-import PIL.ImageGrab nova.py

      - name: Контрольная сумма
        shell: pwsh
        run: (Get-FileHash dist\Nova.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii dist\Nova.exe.sha256

      - name: Установщик
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          choco install innosetup -y --no-progress
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой" }

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/Nova.exe
            dist/Nova.exe.sha256
            dist/Nova-Setup.exe
