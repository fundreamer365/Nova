name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка VERSION и тега
        shell: pwsh
        run: |
          $v = (Select-String -Path nova.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSION=$v не совпадает с тегом ${{ github.ref_name }}" }

      - name: Сборка
        shell: cmd
        run: build.bat

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Nova.exe
            dist/Nova.exe.sha256
          generate_release_notes: true